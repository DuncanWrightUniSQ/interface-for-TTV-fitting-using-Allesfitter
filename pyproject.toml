[project]
name = "ttv-fitter"
version = "1.0.0"
description = "Streamlit transit timing variation fitter and 3D multiplanet renderer."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "streamlit>=1.35",
  "numpy>=1.26",
  "pandas>=2.1",
  "plotly>=5.20",
  "scipy>=1.11",
  "emcee>=3.1",
  "astropy>=6.0",
  "rebound>=4.0",
  "astroquery>=0.4",
  "batman-package>=2.5",
  "corner>=2.2",
  "h5py>=3.10",
  "lightkurve>=2.5",
  "wotan>=1.10",
  "statsmodels>=0.14.6",
  "setuptools>=70",
]

[tool.ruff]
line-length = 100
